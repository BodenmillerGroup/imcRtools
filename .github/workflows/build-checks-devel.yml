name: build-checks-devel

on:
  push:
    branches: [ devel ]
  pull_request:
    branches:
      - devel

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up R (devel)
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'devel'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libharfbuzz-dev libfribidi-dev zlib1g-dev libfftw3-dev \
            libxml2-dev libxt-dev curl libglpk-dev libcairo2-dev \
            libmagick++-dev libcurl4-gnutls-dev libudunits2-dev \
            libgdal-dev libproj-dev pandoc libnode-dev tk libv8-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            BiocManager
            rcmdcheck
            BiocCheck
            sf
            concaveman
            svglite
          needs: vignette

      - name: Check
        run: |
          rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "error")
        shell: Rscript {0}

      - name: BiocCheck
        run: |
          BiocManager::install("BiocCheck", force = TRUE)
          BiocCheck::BiocCheck(".")
        shell: Rscript {0}

      - name: Session info
        run: |
          options(width = 100)
          pkgs <- installed.packages()[, "Package"]
          sessioninfo::session_info(pkgs, include_base = TRUE)
        shell: Rscript {0}
